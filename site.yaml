  telefono: "983 41 27 65"
  email: hola@esguevaobras.es
  direccion: "Paseo de Zorrilla 112, 1.º, 47006 Valladolid"
  horario: Lunes a jueves de 8:30 a 14:00 y de 16:00 a 19:00. Viernes de 8:30 a 15:00.
  whatsapp: "+34 646 27 41 90"
redes:
  instagram: https://www.instagram.com/
