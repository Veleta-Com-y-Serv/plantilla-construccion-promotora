  descripcion: Obra nueva, construcción para terceros y rehabilitación de edificios en Valladolid. Promociones de pisos y pareados con entrega en plazo.
  tipo: GeneralContractor   # tipo de schema.org
marca_pie: true   # «Web creada con NoExpertise» en el pie

secciones:
